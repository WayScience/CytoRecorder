name: Check
'on':
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:assets
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      # Firefox's WebAudio backend can hang resuming an AudioContext when the
      # runner has no real sound device; a dummy PulseAudio sink gives it one.
      # Chromium's fake-media-stream flags don't need this.
      - name: Start a dummy audio device for Firefox WebAudio tests
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          pactl load-module module-null-sink sink_name=cytorecorder_dummy sink_properties=device.description=CytoRecorder_Dummy_Output
          pactl set-default-sink cytorecorder_dummy
      - run: npm run test:browser
      - run: npm run test:static
      - run: npm audit --audit-level=moderate
  cytorecorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cytorecorder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run pre-commit run --all-files
      - run: uv run --frozen pytest
