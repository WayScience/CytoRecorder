---
# template configuration for release-drafter
# see: https://github.com/release-drafter/release-drafter
# Scoped to the cytorecorder companion CLI's own PyPI release stream,
# not the browser app (which deploys continuously via Pages on every push
# to main and does not use GitHub Releases). See
# .github/workflows/draft-release.yml for the matching path filter and
# cytorecorder/pyproject.toml's tag_regex for the version parser.
name-template: 'cytorecorder v$RESOLVED_VERSION'
tag-template: 'cytorecorder-v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
      - 'release-major'
  minor:
    labels:
      - 'release-minor'
  patch:
    labels:
      - 'release-patch'
  default: patch
change-template: '- $TITLE (@$AUTHOR via #$NUMBER)'
template: |
  ## Changes

  $CHANGES
