# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# This config lives under cytorecorder/ inside the larger
# WayScience/CytoRecorder monorepo. pre-commit always resolves paths
# relative to the git top-level, regardless of which directory you invoke
# it from, so every path here (including this top-level `files:` guard) is
# written relative to the repo root, not this subdirectory, to keep this
# subpackage's checks from ever touching the browser app's own files.
files: ^cytorecorder/
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: detect-private-key
-   repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.6.0"
    hooks:
    -   id: pyproject-fmt
-   repo: https://github.com/citation-file-format/cffconvert
    rev: 5295f87c0e261da61a7b919fc754e3a77edd98a7
    hooks:
    -   id: validate-cff
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        exclude: |
          (?x)^(
              .*\.lock |
              .*\.csv |
              .*\.cff |
              .*\.ipynb
          )$
-   repo: https://github.com/executablebooks/mdformat
    rev: 0.7.21
    hooks:
    -   id: mdformat
        additional_dependencies:
        -   mdformat-gfm
-   repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
    -   id: yamllint
        exclude: pre-commit-config.yaml
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.11.11"
    hooks:
    -   id: ruff-format
    -   id: ruff-check
-   repo: https://github.com/jendrikseipp/vulture
    rev: 'v2.14'
    hooks:
    -   id: vulture
        # pass_filenames: false upstream, and pyproject.toml's own
        # [tool.vulture] paths are self-relative (correct for a direct
        # `uv run vulture` from within this directory) but unreachable
        # here since pre-commit's cwd is the monorepo root.
        args: [cytorecorder/src/cytorecorder, cytorecorder/tests, --min-confidence=90]
-   repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.99
    hooks:
    -   id: ty
        # --project pins ty to this subpackage's pyproject.toml/venv;
        # without it, ty treats pre-commit's monorepo-root cwd as the
        # project root and fails to resolve this package's own imports.
        args: [--frozen, --project, cytorecorder]
